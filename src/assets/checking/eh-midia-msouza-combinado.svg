<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70">
  <rect width="380" height="70" fill="#111111" rx="6"/>

  <!-- ===== EH! Mídia Logo ===== -->
  <!-- Black box background for EH! -->
  <rect x="8" y="8" width="90" height="54" rx="4" fill="#1a1a1a"/>

  <!-- Star/sparkle: 4-point star + small dot -->
  <g transform="translate(18, 18)">
    <!-- 4-pointed star -->
    <polygon points="9,0 11,6 17,8 11,10 9,16 7,10 1,8 7,6" fill="#F5C518"/>
    <!-- small sparkle dot top right -->
    <circle cx="17" cy="2" r="2" fill="#F5C518"/>
  </g>

  <!-- EH! text -->
  <text x="38" y="32" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF">EH!</text>
  <!-- Mídia subtext -->
  <text x="38" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="12" fill="#FFFFFF" letter-spacing="1.5">Mídia</text>

  <!-- Yellow bottom bar on EH! box -->
  <rect x="8" y="59" width="90" height="3" rx="1" fill="#F5C518"/>

  <!-- ===== Divider / spacing ===== -->

  <!-- ===== M.Souza Logo ===== -->
  <!-- Geometric icon: layered mountain/triangle with bubble -->
  <g transform="translate(112, 10)">
    <!-- Outer white shape -->
    <path d="M8,50 Q13,8 26,6 Q36,4 42,50 Z" fill="#FFFFFF"/>
    <!-- Inner dark cutout -->
    <path d="M15,50 Q19,20 26,18 Q32,16 36,50 Z" fill="#111111"/>
    <!-- Bubble with ring -->
    <circle cx="30" cy="5" r="6" fill="#FFFFFF"/>
    <circle cx="30" cy="5" r="3" fill="#111111"/>
    <circle cx="30" cy="5" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- M.SOUZA text -->
  <text x="165" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="2">M.SOUZA</text>

  <!-- Yellow accent line under M.SOUZA -->
  <rect x="163" y="54" width="205" height="3" rx="1" fill="#F5C518"/>
</svg>
